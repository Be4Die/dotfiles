[env]
TERM = "xterm-256color"

[window]
opacity = 1.0
decorations = "none"
padding = { x = 8, y = 8 }

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 8.5

[colors.primary]
background = "#303446"
foreground = "#c6d0f5"

[colors.normal]
black   = "#51576d"
red     = "#e78284"
green   = "#a6d189"
yellow  = "#e5c890"
blue    = "#8caaee"
magenta = "#f4b8e4"
cyan    = "#81c8be"
white   = "#b5bfe2"

[colors.bright]
black   = "#626880"
red     = "#ea999c"
green   = "#a6d189"
yellow  = "#ead69d"
blue    = "#9ab4f0"
magenta = "#f4b8e4"
cyan    = "#81c8be"
white   = "#b5bfe2"

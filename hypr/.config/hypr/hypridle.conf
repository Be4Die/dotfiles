general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /home/michael/dotfiles/scripts/change-brightness + 50%
}

listener {
    timeout = 600                                 # 10 min
    on-timeout = hyprlock                         # lock screen
}

listener {
    timeout = 660                                 # 11 min
    on-timeout = brightnessctl -d gmux_backlight set 0% # turn off screen backlight
    on-resume = /home/michael/dotfiles/scripts/change-brightness + 50%
}

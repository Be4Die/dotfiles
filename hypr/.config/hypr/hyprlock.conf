# ==============================================================================
# Catppuccin Frappe hyprlock configuration for MacBook Pro Retina 15"
# ==============================================================================

$rosewater = rgb(242, 213, 207)
$flamingo  = rgb(238, 190, 190)
$pink      = rgb(244, 184, 228)
$mauve     = rgb(202, 158, 230)
$red       = rgb(231, 130, 132)
$maroon    = rgb(234, 153, 156)
$peach     = rgb(239, 159, 118)
$yellow    = rgb(229, 200, 144)
$green     = rgb(166, 209, 137)
$teal      = rgb(129, 200, 190)
$sky       = rgb(153, 209, 219)
$sapphire  = rgb(133, 193, 220)
$blue      = rgb(140, 170, 238)
$lavender  = rgb(186, 187, 241)
$text      = rgb(198, 208, 245)
$subtext1  = rgb(181, 191, 226)
$subtext0  = rgb(165, 173, 206)
$overlay2  = rgb(148, 156, 187)
$overlay1  = rgb(131, 139, 167)
$overlay0  = rgb(115, 121, 148)
$surface2  = rgb(98, 104, 128)
$surface1  = rgb(81, 87, 109)
$surface0  = rgb(65, 69, 89)
$base      = rgb(48, 52, 70)
$mantle    = rgb(41, 44, 60)
$crust     = rgb(35, 38, 52)

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/michael/dotfiles/wallpapers/wallpapers/h_1.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    color = $base
}

# Time (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = $subtext0
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 65
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = <span>Welcome back, <span foreground="##ca9ee6"><b>$USER</b></span></span>
    color = $text
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <i><span foreground="##a5adce">Enter Password...</span></i>
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = <i><span foreground="##e78284">$FAIL ($ATTEMPTS)</span></i>
    capslock_color = $yellow
    position = 0, -90
    halign = center
    valign = center
}

source = ~/.config/hypr/frappe.conf

################
### MONITORS ###
################

monitor = HDMI-A-1, preferred, 1080x420, 1
monitor = DVI-D-1, 1920x1080@60, 0x0, 1, transform, 1

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = thunar
$menu = wofi --conf ~/.config/wofi/config/config --style ~/.config/wofi/src/frappe/style.css --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
exec-once = systemctl --user start hyprpolkitagent
exec-once = dunst
exec-once = wallpaper-toggle init
exec-once = waybar
exec-once = sleep 2 && hyprctl reload

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = NVD_BACKEND,direct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba($mauveAlphaee) rgba($blueAlphaee) 45deg
    col.inactive_border = rgba($surface0Alphaaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2.0
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba($crustAlphaee)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.1696
        vibrancy_darkness = 0.5
    }
}

# =============================================
# ANIMATIONS — Catppuccin Frappe style (плавные и красивые)
# =============================================
animations {
    enabled = true

    # Премиальные сглаженные кривые (без резких вылетов и отскоков)
    bezier = md3_decel, 0.05, 0.7, 0.1, 1.0
    bezier = easeOutExpo, 0.16, 1.0, 0.3, 1.0
    bezier = smoothOut, 0.36, 0.0, 0.66, 1.0
    bezier = gentle, 0.25, 0.8, 0.25, 1.0

    # Анимации окон (плавные и мягкие)
    animation = windows, 1, 4, md3_decel, slide
    animation = windowsIn, 1, 4, md3_decel, slide 20%
    animation = windowsOut, 1, 3, smoothOut, slide 20%
    animation = windowsMove, 1, 4, easeOutExpo, slide

    # Границы
    animation = border, 1, 5, gentle
    animation = borderangle, 1, 30, linear, loop

    # Затухание (fade)
    animation = fade, 1, 4, smoothOut
    animation = fadeIn, 1, 3, smoothOut
    animation = fadeOut, 1, 3, smoothOut

    # Панели и оверлеи (wofi, waybar и т.д.)
    animation = layers, 1, 4, md3_decel, fade
    animation = layersIn, 1, 3, md3_decel, slide
    animation = layersOut, 1, 3, smoothOut, fade

    # Переключение рабочих столов (плавный сдвиг с мягким проявлением)
    animation = workspaces, 1, 4, easeOutExpo, slidefade 15%
    animation = workspacesIn, 1, 4, easeOutExpo, slidefade 15%
    animation = workspacesOut, 1, 4, smoothOut, slidefade 15%
}

# =============================================
dwindle {
    preserve_split = true
    # force_split = 2          # можно раскомментировать, если хочешь всегда 2 колонки
    special_scale_factor = 0.8
}

master {
    new_status = slave   # или master — пробуй оба, slave обычно удобнее
    # new_on_top = true
}

# =============================================
misc {
    force_default_wallpaper = 0          # 0 = отключить дефолтные аниме-обои Hyprland
    disable_hyprland_logo = true
    disable_splash_rendering = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true              # автоматически фокусирует окна при активации
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Custom Application Shortcuts
bind = $mainMod SHIFT, T, exec, Telegram
bind = $mainMod SHIFT, F, exec, firefox
bind = $mainMod SHIFT, H, exec, alacritty -e herdr
bind = $mainMod SHIFT, Z, exec, zed
bind = $mainMod SHIFT, W, exec, wallpaper-toggle

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ===== SCREENSHOTS (Hyprshot) =====
# Выбрать область (как в Windows по умолчанию)
bind = , PRINT, exec, hyprshot -m region --clipboard-only

# Скриншот активного окна
bind = $mainMod, PRINT, exec, hyprshot -m window

# Скриншот всего монитора
bind = $mainMod_SHIFT, PRINT, exec, hyprshot -m output

# Скриншот области + сразу в буфер (без сохранения файла)
bind = CTRL, PRINT, exec, hyprshot -m region --clipboard-only

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

[global]
    monitor = 0
    origin = top-right
    offset = (10, 10)
    width = (200, 260)
    height = (0, 120)

    # Внешний вид
    frame_width = 1
    corner_radius = 8
    transparency = 8
    padding = 6
    horizontal_padding = 8
    separator_height = 1
    separator_color = frame

    # Шрифт
    font = Inter 8.5
    markup = full

    # Иконки
    icon_position = left
    min_icon_size = 20
    max_icon_size = 28
    icon_theme = Papirus-Dark,Catppuccin-Dark,Adwaita

    # Горячие клавиши (совместимы с Hyprland по умолчанию)
    close = ctrl+space
    close_all = ctrl+shift+space
    history = ctrl+grave
    context = ctrl+shift+period

[urgency_low]
    background = "#292c3c"   # Mantle
    foreground = "#c6d0f5"   # Text
    frame_color = "#a6d189"  # Green
    timeout = 5

[urgency_normal]
    background = "#303446"   # Base
    foreground = "#c6d0f5"   # Text
    frame_color = "#8caaee"  # Blue
    timeout = 10

[urgency_critical]
    background = "#292c3c"   # Mantle
    foreground = "#f2d5cf"   # Rosewater
    frame_color = "#e78284"  # Red
    timeout = 0
    fullscreen = show

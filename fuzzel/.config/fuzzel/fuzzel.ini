# Fuzzel Configuration - Catppuccin Frappe Theme
# High-DPI / Retina optimized, zero-latency Wayland launcher

# output= (defaults to currently focused monitor)
font=JetBrainsMono Nerd Font:size=13
dpi-aware=auto
use-bold=no
prompt="󰍉  "
placeholder=Поиск приложений...
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic
terminal=alacritty -e

anchor=center
lines=12
width=45
horizontal-pad=24
vertical-pad=16
inner-pad=10
image-size-ratio=0.5

line-height=26
letter-spacing=0

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=303446fa
text=c6d0f5ff
prompt=ca9ee6ff
placeholder=838ba7ff
input=c6d0f5ff
match=ca9ee6ff
selection=51576dff
selection-text=c6d0f5ff
selection-match=ca9ee6ff
counter=838ba7ff
border=ca9ee6ff

[border]
width=2
radius=12
selection-radius=8

[dmenu]
mode=text
exit-immediately-if-empty=no
